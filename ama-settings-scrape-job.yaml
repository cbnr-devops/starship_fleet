apiVersion: v1
kind: ConfigMap
metadata:
  name: ama-metrics-prometheus-config
  namespace: kube-system
data:
  prometheus-config: |
    scrape_configs:
    - job_name: 'starship-fleet'
      scrape_interval: 15s
      metrics_path: /metrics
      kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
          - dev
      relabel_configs:
      - source_labels: [__meta_kubernetes_service_label_env]
        action: keep
        regex: dev